<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test di Pronuncia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f1ea;
    --surface: #ffffff;
    --surface-alt: #eae7dd;
    --border: #ddd8ca;
    --ink: #1e1c19;
    --muted: #736e64;
    --accent: #33459b;
    --accent-ink: #ffffff;
    --correct-bg: #dff2e4;
    --correct-ink: #1c7a41;
    --similar-bg: #faedd0;
    --similar-ink: #8a5f06;
    --wrong-bg: #fbe1de;
    --wrong-ink: #b8362a;
    --shadow: 0 24px 60px -20px rgba(30, 28, 25, 0.25);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14151b;
      --surface: #1d1f29;
      --surface-alt: #262838;
      --border: #34374a;
      --ink: #eeeef5;
      --muted: #9b9db3;
      --accent: #8b9bff;
      --accent-ink: #14151b;
      --correct-bg: #16321f;
      --correct-ink: #4fd487;
      --similar-bg: #3a2c0f;
      --similar-ink: #f4c04b;
      --wrong-bg: #3a1a1a;
      --wrong-ink: #ff8b7d;
      --shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.6);
    }
  }

  :root[data-theme="dark"] {
    --bg: #14151b;
    --surface: #1d1f29;
    --surface-alt: #262838;
    --border: #34374a;
    --ink: #eeeef5;
    --muted: #9b9db3;
    --accent: #8b9bff;
    --accent-ink: #14151b;
    --correct-bg: #16321f;
    --correct-ink: #4fd487;
    --similar-bg: #3a2c0f;
    --similar-ink: #f4c04b;
    --wrong-bg: #3a1a1a;
    --wrong-ink: #ff8b7d;
    --shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    color: var(--ink);
  }

  .card {
    width: 100%;
    max-width: 620px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  header {
    display: flex;
    flex-direction: column;
    gap: 6px;
    text-align: center;
  }

  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1 {
    font-family: "Manrope", system-ui, sans-serif;
    font-weight: 800;
    font-size: 1.5rem;
    margin: 0;
    text-wrap: balance;
  }

  p.subtitle {
    color: var(--muted);
    margin: 0;
    font-size: 0.95rem;
  }

  .phrase {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 1.2rem;
    line-height: 2.3;
    text-align: center;
    padding: 24px 20px;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 14px;
  }

  .phrase span {
    display: inline-block;
    padding: 3px 8px;
    margin: 2px;
    border-radius: 7px;
    background: transparent;
    color: var(--ink);
  }

  .phrase span.correct { background: var(--correct-bg); color: var(--correct-ink); }
  .phrase span.similar { background: var(--similar-bg); color: var(--similar-ink); }
  .phrase span.wrong   { background: var(--wrong-bg); color: var(--wrong-ink); }

  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  #mic-btn {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 1.8rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 26px -8px color-mix(in srgb, var(--accent) 60%, transparent);
    transition: transform 0.15s ease;
  }

  #mic-btn:hover { transform: scale(1.05); }
  #mic-btn:active { transform: scale(0.96); }

  #mic-btn:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 3px;
  }

  .listen-row {
    display: flex;
    justify-content: center;
  }

  #speak-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: 0.85rem;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  #speak-btn:hover { border-color: var(--accent); color: var(--accent); }

  #speak-btn:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 3px;
  }

  #speak-btn.speaking { border-color: var(--accent); color: var(--accent); }

  #speak-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #speak-btn:disabled:hover { border-color: var(--border); color: var(--ink); }

  #mic-btn.listening {
    background: var(--wrong-ink);
    animation: pulse 1.4s infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    #mic-btn.listening { animation: none; }
    #mic-btn { transition: none; }
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--wrong-ink) 45%, transparent); }
    70%  { box-shadow: 0 0 0 16px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }

  #status {
    color: var(--muted);
    font-size: 0.88rem;
    min-height: 1.2em;
    text-align: center;
  }

  #transcript {
    padding: 14px 18px;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.85rem;
    color: var(--muted);
    min-height: 1.4em;
    text-align: center;
  }

  #transcript strong { color: var(--ink); font-weight: 500; }

  .legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    font-size: 0.8rem;
    color: var(--muted);
  }

  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .dot.correct { background: var(--correct-ink); }
  .dot.similar { background: var(--similar-ink); }
  .dot.wrong { background: var(--wrong-ink); }

  .warning {
    background: var(--wrong-bg);
    border: 1px solid color-mix(in srgb, var(--wrong-ink) 40%, transparent);
    color: var(--wrong-ink);
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 0.85rem;
    text-align: center;
    display: none;
  }
</style>
</head>
<body>
  <div class="card">
    <header>
      <span class="eyebrow">Pronunciation Check</span>
      <h1>Prova la tua pronuncia</h1>
      <p class="subtitle">Premi il microfono e leggi ad alta voce la frase qui sotto</p>
    </header>

    <div class="listen-row">
      <button id="speak-btn" title="Ascolta la frase" aria-label="Ascolta la frase">🔊 Ascolta</button>
    </div>

    <div class="phrase" id="phrase"></div>

    <div class="controls">
      <button id="mic-btn" title="Avvia riconoscimento vocale" aria-label="Avvia riconoscimento vocale">🎤</button>
      <div id="status">Premi il microfono per iniziare</div>
    </div>

    <div id="transcript"></div>

    <div class="legend">
      <span><i class="dot correct"></i> corretta</span>
      <span><i class="dot similar"></i> simile</span>
      <span><i class="dot wrong"></i> sbagliata / mancante</span>
    </div>

    <div class="warning" id="warning">
      Il tuo browser non supporta il riconoscimento vocale (Web Speech API).
      Prova con Google Chrome su desktop o Android.
    </div>
  </div>

<script>
(function () {
  const TARGET_PHRASE = "Hello, I'm Giancarlo. I'm from Mondovì, Italy.";

  const phraseEl = document.getElementById('phrase');
  const micBtn = document.getElementById('mic-btn');
  const speakBtn = document.getElementById('speak-btn');
  const statusEl = document.getElementById('status');
  const transcriptEl = document.getElementById('transcript');
  const warningEl = document.getElementById('warning');

  function stripForCompare(word) {
    return word
      .toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z']/g, '');
  }

  function tokenize(text) {
    return text.trim().split(/\s+/).filter(Boolean);
  }

  const targetWords = tokenize(TARGET_PHRASE);

  function renderInitial() {
    phraseEl.innerHTML = targetWords
      .map(function (w) { return '<span>' + w + '</span>'; })
      .join(' ');
  }

  function levenshtein(a, b) {
    const m = a.length, n = b.length;
    if (m === 0) return n;
    if (n === 0) return m;
    const dp = new Array(n + 1);
    for (let j = 0; j <= n; j++) dp[j] = j;
    for (let i = 1; i <= m; i++) {
      let prev = dp[0];
      dp[0] = i;
      for (let j = 1; j <= n; j++) {
        const tmp = dp[j];
        dp[j] = Math.min(
          dp[j] + 1,
          dp[j - 1] + 1,
          prev + (a[i - 1] === b[j - 1] ? 0 : 1)
        );
        prev = tmp;
      }
    }
    return dp[n];
  }

  function similarity(a, b) {
    if (!a.length && !b.length) return 1;
    const dist = levenshtein(a, b);
    const maxLen = Math.max(a.length, b.length);
    return maxLen === 0 ? 1 : 1 - dist / maxLen;
  }

  // Global alignment (Needleman-Wunsch) scored by word similarity, so extra,
  // missing, or reordered words don't derail the rest of the comparison.
  function alignWords(target, recognized) {
    const n = target.length, m = recognized.length;
    const GAP = -0.6;
    const score = [];
    const traceback = [];
    for (let i = 0; i <= n; i++) {
      score.push(new Array(m + 1).fill(0));
      traceback.push(new Array(m + 1).fill(null));
    }
    for (let i = 1; i <= n; i++) { score[i][0] = score[i - 1][0] + GAP; traceback[i][0] = 'up'; }
    for (let j = 1; j <= m; j++) { score[0][j] = score[0][j - 1] + GAP; traceback[0][j] = 'left'; }

    const tNorm = target.map(stripForCompare);
    const rNorm = recognized.map(stripForCompare);

    for (let i = 1; i <= n; i++) {
      for (let j = 1; j <= m; j++) {
        const matchScore = score[i - 1][j - 1] + similarity(tNorm[i - 1], rNorm[j - 1]);
        const upScore = score[i - 1][j] + GAP;
        const leftScore = score[i][j - 1] + GAP;
        const best = Math.max(matchScore, upScore, leftScore);
        score[i][j] = best;
        if (best === matchScore) traceback[i][j] = 'diag';
        else if (best === upScore) traceback[i][j] = 'up';
        else traceback[i][j] = 'left';
      }
    }

    const pairs = [];
    let i = n, j = m;
    while (i > 0 || j > 0) {
      const dir = traceback[i][j];
      if (dir === 'diag') {
        pairs.unshift({ targetIndex: i - 1, recognizedIndex: j - 1 });
        i--; j--;
      } else if (dir === 'up') {
        pairs.unshift({ targetIndex: i - 1, recognizedIndex: null });
        i--;
      } else {
        j--;
      }
    }
    return pairs;
  }

  function classify(targetWord, recognizedWord) {
    if (recognizedWord === null || recognizedWord === undefined) return 'wrong';
    const t = stripForCompare(targetWord);
    const r = stripForCompare(recognizedWord);
    if (t === r) return 'correct';
    const sim = similarity(t, r);
    if (sim >= 0.6) return 'similar';
    return 'wrong';
  }

  function renderResult(recognizedText) {
    const recognizedWords = tokenize(recognizedText);
    const pairs = alignWords(targetWords, recognizedWords);
    const spans = pairs.map(function (pair) {
      const word = targetWords[pair.targetIndex];
      const recognizedWord = pair.recognizedIndex !== null ? recognizedWords[pair.recognizedIndex] : null;
      const cls = classify(word, recognizedWord);
      return '<span class="' + cls + '">' + word + '</span>';
    });
    phraseEl.innerHTML = spans.join(' ');
    transcriptEl.innerHTML = '<strong>Hai detto:</strong> ' + (recognizedText ? recognizedText : '(nessun testo riconosciuto)');
  }

  renderInitial();

  const synth = window.speechSynthesis;

  if (!synth) {
    speakBtn.disabled = true;
  } else {
    let voices = [];

    function loadVoices() {
      voices = synth.getVoices();
    }
    loadVoices();
    if ('onvoiceschanged' in synth) {
      synth.onvoiceschanged = loadVoices;
    }

    function pickVoice() {
      if (!voices.length) voices = synth.getVoices();
      const preferredNames = [
        'Google US English',
        'Samantha',
        'Microsoft Aria Online (Natural) - English (United States)',
        'Microsoft Jenny Online (Natural) - English (United States)'
      ];
      for (const name of preferredNames) {
        const match = voices.find(function (v) { return v.name === name; });
        if (match) return match;
      }
      const enUS = voices.find(function (v) { return v.lang === 'en-US'; });
      if (enUS) return enUS;
      return voices.find(function (v) { return v.lang && v.lang.indexOf('en') === 0; }) || null;
    }

    speakBtn.addEventListener('click', function () {
      if (synth.speaking) {
        synth.cancel();
        return;
      }
      const utterance = new SpeechSynthesisUtterance(TARGET_PHRASE);
      utterance.lang = 'en-US';
      const voice = pickVoice();
      if (voice) utterance.voice = voice;
      utterance.rate = 0.95;
      utterance.onstart = function () { speakBtn.classList.add('speaking'); };
      utterance.onend = function () { speakBtn.classList.remove('speaking'); };
      utterance.onerror = function () { speakBtn.classList.remove('speaking'); };
      synth.cancel();
      synth.speak(utterance);
    });
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    warningEl.style.display = 'block';
    micBtn.disabled = true;
    micBtn.style.opacity = 0.4;
    micBtn.style.cursor = 'not-allowed';
    statusEl.textContent = 'Riconoscimento vocale non disponibile';
  } else {
    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    let listening = false;

    recognition.onstart = function () {
      listening = true;
      micBtn.classList.add('listening');
      statusEl.textContent = 'In ascolto... parla ora';
    };

    recognition.onend = function () {
      listening = false;
      micBtn.classList.remove('listening');
      if (statusEl.textContent === 'In ascolto... parla ora') {
        statusEl.textContent = 'Premi il microfono per iniziare';
      }
    };

    recognition.onerror = function (event) {
      listening = false;
      micBtn.classList.remove('listening');
      let msg = 'Errore nel riconoscimento vocale';
      if (event.error === 'no-speech') msg = 'Nessun parlato rilevato, riprova';
      else if (event.error === 'not-allowed' || event.error === 'service-not-allowed') msg = 'Permesso microfono negato';
      statusEl.textContent = msg;
    };

    recognition.onresult = function (event) {
      const text = event.results[0][0].transcript;
      renderResult(text);
      statusEl.textContent = 'Fatto! Premi di nuovo il microfono per riprovare';
    };

    micBtn.addEventListener('click', function () {
      if (listening) {
        recognition.stop();
        return;
      }
      if (synth && synth.speaking) synth.cancel();
      renderInitial();
      transcriptEl.innerHTML = '';
      try {
        recognition.start();
      } catch (e) {
        statusEl.textContent = 'Impossibile avviare il microfono';
      }
    });
  }
})();
</script>
</body>
</html>
